[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "email-corpus-analyzer"
version = "2.0.0"
description = "Multi-provider email corpus analysis with LLM-powered categorization"
requires-python = ">=3.11"
dependencies = [
    # Core data validation
    "pydantic>=2.0.0",

    # Async support
    "aiofiles>=23.0.0",

    # Email Providers - M365
    "msgraph-sdk>=1.0.0",
    "azure-identity>=1.15.0",

    # Email Providers - Gmail
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.1.0",

    # Email Providers - IMAP
    "aioimaplib>=1.0.0",

    # ML/Embeddings
    "sentence-transformers>=2.0.0",
    "hdbscan>=0.8.33",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",

    # LLM Integration
    "anthropic>=0.18.0",

    # HTML/Text Processing
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",

    # Modern CLI
    "typer>=0.9.0",
    "rich>=13.0.0",

    # Progress bars
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

# Minimal dependencies for testing without provider SDKs
minimal = [
    "pydantic>=2.0.0",
    "sentence-transformers>=2.0.0",
    "scikit-learn>=1.3.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "tqdm>=4.66.0",
]

[project.scripts]
email-analyzer = "src.cli_new:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PIE", "RET", "SIM"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=src --cov-report=term-missing"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
