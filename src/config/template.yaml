# Email Corpus Analyzer Configuration
# =====================================
# This file configures the email extraction and analysis pipeline.
# Copy this file to one of these locations:
#   - ~/.config/email-analyzer/config.yaml (global)
#   - ./.email-analyzer.yaml (project-specific)
#
# Project config overrides global config.
# CLI arguments override both config files.
#
# Uncomment and modify values as needed.

# Global Settings
# ---------------
# Output directory for all generated files
# output_dir: ~/data/outputs

# Your M365/Hotmail email address (required for extraction)
# user_email: your@email.com

# Enable verbose debug logging
# verbose: false

# Extract Command Settings
# ------------------------
extract:
  # Number of emails to fetch per batch
  batch_size: 500

  # Save checkpoint every N emails
  checkpoint_interval: 100

  # Custom path for corpus JSON (optional)
  # corpus_file: /path/to/corpus.json

# Analyze Command Settings
# ------------------------
analyze:
  # Number of semantic clusters for content analysis
  num_clusters: 10

  # Path to corpus JSON file (optional, uses default if not set)
  # corpus_file: /path/to/corpus.json

  # Custom path for analysis results (optional)
  # analysis_file: /path/to/analysis.json

  # Sender Classification Keywords
  # Customize keywords for automatic sender type classification.
  # Service keywords match against sender email address and domain.
  # Marketing keywords match against subject lines (requires min email count).
  # Work keywords match against subject lines.
  # thresholds:
  #   service_keywords:
  #     - "noreply"
  #     - "no-reply"
  #     - "donotreply"
  #     - "notification"
  #     - "notify"
  #     - "alert"
  #   marketing_keywords:
  #     - "unsubscribe"
  #     - "promotional"
  #     - "offer"
  #     - "discount"
  #     - "sale"
  #     - "promotion"
  #   work_keywords:
  #     - "meeting"
  #     - "project"
  #     - "team"
  #     - "re:"
  #     - "fwd:"

# Suggest Command Settings
# ------------------------
suggest:
  # Minimum cluster size percentage for category generation
  min_cluster_percentage: 5.0

  # Minimum email count for sender-based categories
  min_sender_count: 20

  # Path to analysis results JSON (optional)
  # analysis_file: /path/to/analysis.json

  # Custom path for suggestions JSON (optional)
  # suggestions_file: /path/to/suggestions.json

# Review Command Settings
# -----------------------
review:
  # Path to suggestions JSON (optional)
  # suggestions_file: /path/to/suggestions.json

  # Custom path for approved categories (optional)
  # approved_file: /path/to/approved.json

  # Skip cleanup of intermediate files
  no_cleanup: false

# Pipeline Command Settings
# -------------------------
pipeline:
  # Number of semantic clusters
  num_clusters: 10

  # Skip cleanup of intermediate files
  no_cleanup: false

# Classifier Settings (Phase 1 - LLM Classification)
# ---------------------------------------------------
# classifier:
#   # LLM provider: ollama (local), claude, or openai
#   provider: ollama
#
#   # Model to use for classification
#   model_name: "qwen2.5:7b"
#
#   # Ollama API server URL (only used when provider is ollama)
#   ollama_base_url: "http://localhost:11434"
#
#   # Environment variable containing API key (for cloud providers)
#   # api_key_env_var: ANTHROPIC_API_KEY
#
#   # Minimum confidence to accept a classification result (0.0-1.0)
#   confidence_threshold: 0.6
#
#   # Maximum tokens for LLM response
#   max_tokens: 200
#
#   # Temperature (0.0 = deterministic)
#   temperature: 0.0
#
#   # Category definitions for classification
#   # Each category needs a name and description; keywords are optional hints
#   categories:
#     - name: "Newsletters"
#       description: "Periodic newsletter emails, digests, and subscriptions"
#       keywords: ["newsletter", "digest", "weekly", "monthly"]
#     - name: "Shopping"
#       description: "Order confirmations, shipping notifications, and receipts"
#       keywords: ["order", "receipt", "shipping", "delivered"]
#     - name: "Finance"
#       description: "Bank statements, payment notifications, and financial alerts"
#       keywords: ["bank", "payment", "statement", "transaction"]
#     - name: "Social"
#       description: "Social media notifications and messages"
#       keywords: ["liked", "commented", "followed", "mentioned"]
#     - name: "Work"
#       description: "Work-related emails, meetings, and project updates"
#       keywords: ["meeting", "project", "deadline", "review"]
